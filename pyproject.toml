[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screenwarden"
version = "0.1.0"
description = "Security layer for AI agents that operate Android phones"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The CyberLayer" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
pixels = ["pillow>=10"]
agent = ["anthropic>=0.40", "pillow>=10"]
dev = ["pytest>=8", "pillow>=10"]

[tool.setuptools]
packages = ["screenwarden"]

[tool.setuptools.package-data]
screenwarden = ["policy.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
